# Baut bei jeder Änderung auf "main" das Installationspaket (Docker-Image) für die NAS
# und legt es unter ghcr.io/stefanskop/protokollwesen ab.
name: NAS-Image bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version bestimmen
        id: v
        run: echo "tag=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.tag }}
          tags: |
            ghcr.io/stefanskop/protokollwesen:latest
            ghcr.io/stefanskop/protokollwesen:${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
